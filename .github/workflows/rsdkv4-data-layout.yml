name: Reorganize project into RSDKv4-style Data layout

on:
  workflow_dispatch:
  push:
    branches:
      - rsdkv4-reorganization
    paths:
      - '.github/workflows/rsdkv4-data-layout.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rsdkv4-reorganization
          fetch-depth: 0

      - name: Move files and update Godot paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil

          # RSDK-style Data categories; existing filenames/extensions are untouched.
          moves = [
              ("Audio/Soundtrack", "Data/Music"),
              ("Audio/SFX", "Data/SoundFX"),
              ("Graphics", "Data/Sprites"),
              ("Scene", "Data/Stages"),
              ("Tileset", "Data/Stages/Tileset"),
              ("Scripts", "Data/Scripts"),
              ("Entities", "Data/Scripts/Entities"),
              ("Entitites3D", "Data/Scripts/Entities3D"),
              ("Models", "Data/Models"),
              ("Shaders", "Data/Shaders"),
              ("Resources", "Data/Game/Resources"),
          ]

          for old, new in moves:
              src, dst = Path(old), Path(new)
              if not src.exists():
                  continue
              dst.parent.mkdir(parents=True, exist_ok=True)
              if dst.exists():
                  raise RuntimeError(f"Destination already exists: {dst}")
              shutil.move(str(src), str(dst))

          audio = Path("Audio")
          if audio.exists() and not any(audio.iterdir()):
              audio.rmdir()

          replacements = {
              "res://Audio/Soundtrack/": "res://Data/Music/",
              "res://Audio/SFX/": "res://Data/SoundFX/",
              "res://Graphics/": "res://Data/Sprites/",
              "res://Scene/": "res://Data/Stages/",
              "res://Tileset/": "res://Data/Stages/Tileset/",
              "res://Scripts/": "res://Data/Scripts/",
              "res://Entities/": "res://Data/Scripts/Entities/",
              "res://Entitites3D/": "res://Data/Scripts/Entities3D/",
              "res://Models/": "res://Data/Models/",
              "res://Shaders/": "res://Data/Shaders/",
              "res://Resources/": "res://Data/Game/Resources/",
          }

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or ".godot" in path.parts or ".github" in path.parts:
                  continue
              try:
                  raw = path.read_bytes()
                  original = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="")

          leftovers = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or ".godot" in path.parts or ".github" in path.parts:
                  continue
              try:
                  data = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if any(old in data for old in replacements):
                  leftovers.append(str(path))
          if leftovers:
              raise RuntimeError("Unconverted old paths: " + ", ".join(leftovers[:40]))
          print("Files moved and Godot resource paths updated.")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("project.godot").read_text(encoding="utf-8")
          refs = re.findall(r'res://[^"\s]+', p)
          missing = [x for x in refs if not Path(x[6:]).exists() and not x.startswith("res://.godot/")]
          if missing:
              raise SystemExit("Missing project.godot paths: " + ", ".join(missing))
          print(f"Validated {len(refs)} project.godot resource paths.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Organize game assets under RSDKv4 Data layout"
            git push origin HEAD:rsdkv4-reorganization
          fi
