name: Reorganize project into Sonic 2 (2013) RSDKv4-style Data layout

on:
  workflow_dispatch:
  push:
    branches:
      - rsdkv4-reorganization
    paths:
      - '.github/workflows/rsdkv4-data-layout.yml'
      - 'project.godot'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rsdkv4-reorganization
          fetch-depth: 0

      - name: Separate entity scenes from scripts and update Godot paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil

          # These are Godot project categories, arranged to follow the
          # Sonic 2 (2013) RSDKv4 data-folder concept without creating Data.rsdk.
          # Scripts stay in Data/Scripts. Entity scene folders are separate.
          moves = [
              ("Data/Scripts/Entities", "Data/Entities"),
              ("Data/Scripts/Entities3D", "Data/Entitites3D"),
              ("Data/Sprites/Menus", "Data/Game/Menu"),
              ("Data/Sprites/title", "Data/Sprites/Title"),
              ("Data/Sprites/Special Stage", "Data/Sprites/Special"),
              ("Entities", "Data/Entities"),
              ("Entitites3D", "Data/Entitites3D"),
              ("Models", "Data/Game/Models"),
              ("Data/Models", "Data/Game/Models"),
          ]

          def move_or_merge(src: Path, dst: Path):
              if not src.exists() or src.resolve() == dst.resolve():
                  return
              dst.parent.mkdir(parents=True, exist_ok=True)
              if src.is_dir():
                  if dst.exists() and not dst.is_dir():
                      raise RuntimeError(f"Cannot merge directory into file: {dst}")
                  if dst.exists():
                      for item in list(src.iterdir()):
                          target = dst / item.name
                          if target.exists():
                              raise RuntimeError(f"Move collision; refusing to overwrite: {target}")
                          shutil.move(str(item), str(target))
                      src.rmdir()
                  else:
                      shutil.move(str(src), str(dst))
              else:
                  if dst.exists():
                      raise RuntimeError(f"Move collision; refusing to overwrite: {dst}")
                  shutil.move(str(src), str(dst))

          for old_path, new_path in moves:
              move_or_merge(Path(old_path), Path(new_path))

          replacements = {
              "res://Data/Scripts/Entities/": "res://Data/Entities/",
              "res://Data/Scripts/Entities3D/": "res://Data/Entitites3D/",
              "res://Data/Sprites/Menus/": "res://Data/Game/Menu/",
              "res://Data/Sprites/title/": "res://Data/Sprites/Title/",
              "res://Data/Sprites/Special Stage/": "res://Data/Sprites/Special/",
              "res://Entities/": "res://Data/Entities/",
              "res://Entitites3D/": "res://Data/Entitites3D/",
              "res://Models/": "res://Data/Game/Models/",
              "res://Data/Models/": "res://Data/Game/Models/",
          }

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in {".git", ".godot", ".github"} for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for before, after in replacements.items():
                  updated = updated.replace(before, after)
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="")

          # Ensure entity scenes are not nested beneath Scripts.
          forbidden = [Path("Data/Scripts/Entities"), Path("Data/Scripts/Entities3D")]
          remaining = [str(p) for p in forbidden if p.exists()]
          if remaining:
              raise RuntimeError("Entity folders remain inside Scripts: " + ", ".join(remaining))

          print("Entity folders separated; filenames and extensions preserved.")
          PY

      - name: Validate project references and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          project = Path("project.godot").read_text(encoding="utf-8")
          refs = re.findall(r'res://[^"\s]+', project)
          missing = [ref for ref in refs if not Path(ref[6:]).exists() and not ref.startswith("res://.godot/")]
          if missing:
              raise SystemExit("Missing project.godot paths: " + ", ".join(missing))
          print(f"Validated {len(refs)} project.godot resource paths.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Match Sonic 2 2013 Data folder organization"
            git push origin HEAD:rsdkv4-reorganization
          fi
